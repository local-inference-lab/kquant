[project]
name = "kquant"
version = "0.1.0"
description = "Hybrid expert quantization pipeline for Kimi-K3 (MXFP4 keep tier + demoted low-bit tiers)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "safetensors>=0.4.5",
    "numpy>=2.0",
    "tqdm>=4.66",
]

[project.scripts]
kquant = "kquant.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kquant"]
